name: Backend verification

on:
  push:
    branches:
      - backend-stabilization
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout backend stabilization branch
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        id: install
        run: pnpm install --frozen-lockfile

      - name: Run tests
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: pnpm test

      - name: TypeScript typecheck
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: pnpm run typecheck

      - name: ESLint
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: pnpm run lint

      - name: Production compilation (without database migrations)
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: pnpm run build:dev
